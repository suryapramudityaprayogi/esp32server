<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Professional Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* Tema Dasar Hitam Pekat */
    --bg-dark: #050505;
    --surface: #121212;
    --surface-hover: #1a1a1a;
    --border: #262626;
    
    /* Warna Teks */
    --text-main: #ffffff;
    --text-muted: #a3a3a3;
    
    /* Aksen Light Pink */
    --primary: #ffb6c1; 
    --primary-glow: rgba(255, 182, 193, 0.25);
    --primary-bg: rgba(255, 182, 193, 0.05);
    
    /* Status Colors */
    --success: #34d399;
    --danger: #f87171;
    --warning: #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-dark);
    /* Pola Titik (Dot Grid) Samar untuk kesan High-Tech */
    background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--text-main);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* Navbar */
  .navbar {
    background: rgba(18, 18, 18, 0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .navbar-brand { font-weight: 700; font-size: 1.25rem; color: var(--text-main); display: flex; align-items: center; gap: 10px; letter-spacing: 0.5px; }
  .navbar-brand svg { color: var(--primary); filter: drop-shadow(0 0 8px var(--primary-glow)); }

  /* Main Container */
  .container { max-width: 1200px; margin: 0 auto; padding: 30px; }

  /* Section Title */
  .section-title { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1.5px; }

  /* Metrics Grid (Top) */
  .metrics-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px;
  }
  .metric-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
    display: flex; align-items: center; justify-content: space-between;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .metric-card:hover { border-color: #333333; transform: translateY(-2px); }
  .metric-info h3 { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
  .metric-info p { font-size: 1.5rem; font-weight: 700; margin-top: 5px; }
  .metric-icon { 
    width: 48px; height: 48px; border-radius: 12px; background: var(--primary-bg); 
    color: var(--primary); display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255, 182, 193, 0.1);
  }

  /* Main Dashboard Layout */
  .dashboard-layout {
    display: grid; grid-template-columns: 2fr 1fr; gap: 30px;
  }

  /* Relay Controls Grid */
  .controls-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
  }
  
  .relay-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px 20px;
    cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
  }
  .relay-card:hover { border-color: #404040; transform: translateY(-3px); background: var(--surface-hover); }
  .relay-card:active { transform: scale(0.97); }
  
  .relay-card.on {
    background: linear-gradient(145deg, #1a1012, #050505); 
    border-color: var(--primary);
    box-shadow: 0 10px 30px var(--primary-glow), inset 0 0 15px var(--primary-bg);
  }
  
  .relay-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .relay-icon { color: var(--text-muted); transition: 0.3s; }
  .relay-card.on .relay-icon { color: var(--primary); filter: drop-shadow(0 0 8px var(--primary)); }
  
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #333; transition: 0.3s; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
  .relay-card.on .status-dot { background: var(--primary); box-shadow: 0 0 12px var(--primary), inset 0 0 4px #fff; }

  .relay-info h4 { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; letter-spacing: 0.5px; }
  .relay-info p { font-size: 0.8rem; color: var(--text-muted); }
  .relay-state { font-size: 1.25rem; font-weight: 700; color: #404040; margin-top: 15px; transition: 0.3s; }
  .relay-card.on .relay-state { color: var(--text-main); text-shadow: 0 0 10px rgba(255,255,255,0.2); }

  /* Sidebar Panels (Right side) */
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 25px; margin-bottom: 20px;
  }
  
  /* Global Buttons */
  .global-btn {
    width: 100%; padding: 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; font-family: 'Inter', sans-serif;
    cursor: pointer; transition: all 0.2s ease; border: none; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;
    letter-spacing: 0.5px;
  }
  .global-btn.primary { background: var(--primary); color: #000; box-shadow: 0 4px 15px var(--primary-glow); }
  .global-btn.primary:hover { background: #ffc9d2; transform: translateY(-2px); box-shadow: 0 6px 20px var(--primary-glow); }
  .global-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
  .global-btn.secondary:hover { background: var(--surface-hover); border-color: #404040; transform: translateY(-2px); }

  /* Activity Logs */
  .log-list { list-style: none; margin-top: 15px; }
  .log-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px dashed var(--border); font-size: 0.85rem;
  }
  .log-item:last-child { border-bottom: none; }
  .log-time { color: var(--text-muted); font-size: 0.75rem; background: #0a0a0a; padding: 3px 8px; border-radius: 6px; }
  .log-action { font-weight: 500; }
  .log-action.on-text { color: var(--primary); text-shadow: 0 0 8px var(--primary-glow); }
  .log-action.off-text { color: var(--text-muted); }
  .empty-log { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px 0; }

  /* Status Colors */
  .c-success { color: var(--success); }
  .c-danger { color: var(--danger); }
  .c-warning { color: var(--warning); }

  /* Responsive */
  @media (max-width: 900px) {
    .dashboard-layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .controls-grid { grid-template-columns: 1fr; }
    .container { padding: 15px; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line>
    </svg>
    ESP32 Control Center
  </div>
  <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;" id="clock">00:00:00</div>
</nav>

<div class="container">
  
  <!-- Metrics Section -->
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-info">
        <h3>Server Database</h3>
        <p id="db-status" class="c-warning">Menghubungkan...</p>
      </div>
      <div class="metric-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
      </div>
    </div>
    
    <div class="metric-card">
      <div class="metric-info">
        <h3>Status Perangkat (ESP32)</h3>
        <p id="esp-status" class="c-warning">Mengecek...</p>
      </div>
      <div class="metric-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
      </div>
    </div>

    <div class="metric-card">
      <div class="metric-info">
        <h3>Relay Aktif</h3>
        <p id="active-count" style="color: var(--text-main);">0 / 4</p>
      </div>
      <div class="metric-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
      </div>
    </div>
  </div>

  <!-- Main Dashboard Layout -->
  <div class="dashboard-layout">
    
    <!-- Left Column: Controls -->
    <div>
      <div class="section-title">Kontrol Relay Individu</div>
      <div class="controls-grid" id="grid">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Right Column: Sidebar Panels -->
    <div>
      <div class="panel">
        <div class="section-title">Kontrol Global</div>
        <button class="global-btn primary" onclick="setAll(1)">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
          Hidupkan Semua
        </button>
        <button class="global-btn secondary" onclick="setAll(0)">
          Matikan Semua
        </button>
      </div>

      <div class="panel">
        <div class="section-title">Riwayat Aktivitas</div>
        <ul class="log-list" id="log-list">
          <li class="empty-log">Belum ada aktivitas di sesi ini.</li>
        </ul>
      </div>
    </div>

  </div>
</div>

<script>
const FIREBASE_URL = "https://espserver-79064-default-rtdb.firebaseio.com/relay.json";
const pins = [15, 2, 4, 16];
const btnPins = [13, 12, 14, 27];
let data = {relay1:0, relay2:0, relay3:0, relay4:0};

let lastHeartbeatValue = null;
let lastHeartbeatTime = Date.now();
let espIsOnline = false;
let logs = [];

// Update Jam Real-time
setInterval(() => {
  document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID');
}, 1000);

function addLog(message, isOn) {
  const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  logs.unshift({ time, message, isOn });
  if (logs.length > 6) logs.pop(); // Batasi hanya 6 log terakhir
  renderLogs();
}

function renderLogs() {
  const logList = document.getElementById('log-list');
  if (logs.length === 0) return;
  
  let html = "";
  logs.forEach(log => {
    const textClass = log.isOn ? 'on-text' : 'off-text';
    html += `
      <li class="log-item">
        <span class="log-action ${textClass}">${log.message}</span>
        <span class="log-time">${log.time}</span>
      </li>
    `;
  });
  logList.innerHTML = html;
}

function render(){
  let html = "";
  let activeCount = 0;

  for(let i=1; i<=4; i++){
    let on = data['relay'+i] == 1;
    if (on) activeCount++;
    
    html += `
    <div class="relay-card ${on ? 'on' : ''}" onclick="toggle(${i})">
      <div class="relay-header">
        <div class="relay-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        </div>
        <div class="status-dot"></div>
      </div>
      <div class="relay-info">
        <h4>Relay ${i}</h4>
        <p>P${pins[i-1]} • B${btnPins[i-1]}</p>
      </div>
      <div class="relay-state">${on ? 'AKTIF' : 'NONAKTIF'}</div>
    </div>`;
  }
  document.getElementById('grid').innerHTML = html;
  document.getElementById('active-count').innerText = `${activeCount} / 4`;
}

async function ambilData(){
  try{
    let res = await fetch(FIREBASE_URL);
    if(!res.ok) throw new Error("HTTP Error");
    let j = await res.json();
    if(j) { 
      // Deteksi perubahan state yang dilakukan via tombol fisik (ESP32)
      for(let i=1; i<=4; i++) {
        if (data['relay'+i] !== j['relay'+i] && j['relay'+i] !== undefined) {
          data['relay'+i] = j['relay'+i];
          addLog(`Relay ${i} ${j['relay'+i] === 1 ? 'dinyalakan' : 'dimatikan'} (Alat)`, j['relay'+i] === 1);
        }
      }
      
      if (j.heartbeat !== undefined) {
        if (lastHeartbeatValue === null) {
          lastHeartbeatValue = j.heartbeat;
          lastHeartbeatTime = Date.now();
        } else if (j.heartbeat !== lastHeartbeatValue) {
          lastHeartbeatValue = j.heartbeat;
          lastHeartbeatTime = Date.now();
          espIsOnline = true;
        }
      }
    }
    
    const dbStatus = document.getElementById('db-status');
    dbStatus.innerText = 'Online';
    dbStatus.className = 'c-success';
    
    let timeDiff = Date.now() - lastHeartbeatTime;
    if (timeDiff > 12000) espIsOnline = false;

    const espStatus = document.getElementById('esp-status');
    if (!espIsOnline && timeDiff <= 12000) {
      espStatus.innerText = 'Mengecek...';
      espStatus.className = 'c-warning';
    } else if (espIsOnline) {
      espStatus.innerText = 'Terhubung';
      espStatus.className = 'c-success';
    } else {
      espStatus.innerText = 'Offline';
      espStatus.className = 'c-danger';
    }

    render();
  }catch(e){
    document.getElementById('db-status').innerText = 'Terputus';
    document.getElementById('db-status').className = 'c-danger';
    document.getElementById('esp-status').innerText = 'Gagal sinkron';
    document.getElementById('esp-status').className = 'c-danger';
  }
}

async function kirim(){
  let payload = {
    relay1: data.relay1, relay2: data.relay2, 
    relay3: data.relay3, relay4: data.relay4
  };
  render();
  await fetch(FIREBASE_URL, {method:'PATCH', body: JSON.stringify(payload)});
  ambilData();
}

function toggle(num){
  const newState = data['relay'+num] == 1 ? 0 : 1;
  data['relay'+num] = newState;
  addLog(`Relay ${num} ${newState ? 'dinyalakan' : 'dimatikan'} (Web)`, newState === 1);
  kirim();  
}

function setAll(val){
  for(let i=1;i<=4;i++) data['relay'+i] = val;
  addLog(`Semua Relay ${val ? 'dinyalakan' : 'dimatikan'} (Web)`, val === 1);
  kirim();
}

ambilData();
setInterval(ambilData, 1000);
</script>
</body>
</html>
