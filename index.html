<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQUA TRACK - IoT Professional Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* Tema Dasar Dark & Gold */
    --bg-dark: #08080a; 
    --surface: rgba(20, 20, 22, 0.65);
    --surface-hover: rgba(30, 30, 35, 0.85);
    --border: rgba(255, 255, 255, 0.08);
    --border-gold: rgba(212, 175, 55, 0.3);
    
    /* Warna Teks */
    --text-main: #ffffff;
    --text-muted: #9ca3af;
    
    /* Aksen Champagne Gold */
    --primary: #d4af37; 
    --primary-glow: rgba(212, 175, 55, 0.4);
    --primary-bg: rgba(212, 175, 55, 0.1);
    
    /* Status Colors */
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
  }

  /* Efek Latar Belakang Ambient Glow */
  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; pointer-events: none;
  }
  body::before {
    width: 400px; height: 400px; background: rgba(212, 175, 55, 0.07); top: -100px; left: -100px;
  }
  body::after {
    width: 300px; height: 300px; background: rgba(255, 255, 255, 0.02); bottom: -50px; right: -50px;
  }

  /* Efek Glassmorphism Global */
  .glass-panel {
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  }

  /* --- SISTEM LOGIN --- */
  .login-wrapper {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(8, 8, 10, 0.9);
    backdrop-filter: blur(10px);
    display: flex; justify-content: center; align-items: center; z-index: 999;
  }
  .login-box {
    padding: 45px 35px; border-radius: 24px; text-align: center; width: 90%; max-width: 380px;
    animation: fadeIn 0.5s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  
  .login-box svg { color: var(--primary); margin-bottom: 20px; filter: drop-shadow(0 0 12px var(--primary-glow)); }
  .login-box h2 { font-size: 1.75rem; margin-bottom: 8px; font-weight: 600; letter-spacing: 1px; }
  .login-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px; font-weight: 300; }
  
  .login-input {
    width: 100%; padding: 16px; margin-bottom: 20px;
    background: rgba(0,0,0,0.5); border: 1px solid var(--border);
    color: var(--text-main); border-radius: 12px; font-family: 'Poppins', sans-serif; font-size: 1rem;
    outline: none; transition: all 0.3s ease; text-align: center; letter-spacing: 2px;
  }
  .login-input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); background: rgba(0,0,0,0.8); }
  #login-error { color: var(--danger); font-size: 0.85rem; display: none; margin-bottom: 15px; font-weight: 500; }

  /* Navbar */
  .navbar {
    background: rgba(8, 8, 10, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 18px 40px; display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .navbar-brand { font-weight: 700; font-size: 1.3rem; color: var(--text-main); display: flex; align-items: center; gap: 12px; letter-spacing: 1px; }
  .navbar-brand svg { color: var(--primary); filter: drop-shadow(0 0 10px var(--primary-glow)); }

  .nav-right { display: flex; align-items: center; gap: 20px; }
  .logout-btn { 
    background: transparent; border: 1px solid var(--border); color: var(--text-muted); 
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: all 0.3s ease; font-family: 'Poppins', sans-serif;
  }
  .logout-btn:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }

  /* Main Container */
  .container { max-width: 1280px; margin: 0 auto; padding: 40px 30px; flex: 1; width: 100%; }

  /* Section Title */
  .section-title { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }

  /* Metrics Grid (Top) */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; margin-bottom: 40px; }
  .metric-card {
    border-radius: 16px; padding: 25px;
    display: flex; align-items: center; justify-content: space-between; transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .metric-card:hover { border-color: var(--border-gold); transform: translateY(-5px); }
  .metric-info h3 { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
  .metric-info p { font-size: 1.6rem; font-weight: 700; margin-top: 8px; letter-spacing: 0.5px; }
  .metric-icon { 
    width: 54px; height: 54px; border-radius: 14px; background: var(--primary-bg); 
    color: var(--primary); display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(212, 175, 55, 0.15); box-shadow: 0 0 20px rgba(212, 175, 55, 0.05);
  }

  /* Main Dashboard Layout */
  .dashboard-layout { display: grid; grid-template-columns: 1.8fr 1fr; gap: 35px; }

  /* Relay Controls Grid */
  .controls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
  
  .relay-card {
    border-radius: 20px; padding: 30px 25px;
    cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
  }
  .relay-card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at top right, rgba(212,175,55,0.1), transparent 70%); opacity: 0; transition: 0.4s;
  }
  .relay-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-4px); background: var(--surface-hover); }
  .relay-card:active { transform: scale(0.96); }
  
  .relay-card.on {
    background: rgba(20, 18, 12, 0.8);
    border-color: var(--primary);
    box-shadow: 0 10px 40px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(212, 175, 55, 0.05);
  }
  .relay-card.on::before { opacity: 1; }
  
  .relay-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; position: relative; z-index: 2; }
  .relay-icon { color: var(--text-muted); transition: 0.4s; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
  .relay-card.on .relay-icon { color: var(--bg-dark); background: var(--primary); box-shadow: 0 0 20px var(--primary-glow); border-color: var(--primary); }
  
  .status-dot { 
    width: 12px; height: 12px; border-radius: 50%; background: #222; transition: 0.4s; 
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 0 0 4px rgba(0,0,0,0.3); 
  }
  .relay-card.on .status-dot { 
    background: var(--primary); 
    box-shadow: 0 0 15px var(--primary), inset 0 0 5px #fff, 0 0 0 4px rgba(212,175,55,0.1); 
  }

  .relay-info { position: relative; z-index: 2; }
  .relay-info h4 { font-size: 1.25rem; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.5px; }
  .relay-info p { font-size: 0.85rem; color: var(--text-muted); font-weight: 300; }
  .relay-state { font-size: 1.4rem; font-weight: 700; color: #333; margin-top: 20px; transition: 0.4s; position: relative; z-index: 2; }
  .relay-card.on .relay-state { color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }

  /* Sidebar Panels (Right side) */
  .panel { border-radius: 20px; padding: 30px; margin-bottom: 25px; }
  
  /* Global Buttons */
  .global-btn {
    width: 100%; padding: 16px; border-radius: 12px; font-size: 0.95rem; font-weight: 600; font-family: 'Poppins', sans-serif;
    cursor: pointer; transition: all 0.3s ease; border: none; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 12px;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .global-btn.primary { 
    background: linear-gradient(135deg, #e6c875 0%, #d4af37 100%); 
    color: #000; box-shadow: 0 6px 20px var(--primary-glow); 
  }
  .global-btn.primary:hover { background: linear-gradient(135deg, #f0d588 0%, #dfbc4a 100%); transform: translateY(-3px); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5); }
  .global-btn.secondary { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); }
  .global-btn.secondary:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); transform: translateY(-3px); }

  /* Activity Logs */
  .log-list { list-style: none; margin-top: 20px; }
  .log-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem;
    animation: slideIn 0.3s ease-out;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
  .log-item:last-child { border-bottom: none; }
  .log-time { color: var(--text-muted); font-size: 0.75rem; background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
  .log-action { font-weight: 500; letter-spacing: 0.5px; }
  .log-action.on-text { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }
  .log-action.off-text { color: var(--text-muted); }
  .empty-log { text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 30px 0; font-style: italic; }

  /* Status Colors */
  .c-success { color: var(--success); text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
  .c-danger { color: var(--danger); text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
  .c-warning { color: var(--warning); text-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

  /* Responsive */
  @media (max-width: 960px) { .dashboard-layout { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { 
    .controls-grid { grid-template-columns: 1fr; } 
    .container { padding: 20px 15px; } 
    .navbar { padding: 15px 20px; }
  }
</style>
</head>
<body>

<!-- HALAMAN LOGIN -->
<div class="login-wrapper glass-panel" id="login-wrapper" style="border: none; border-radius: 0;">
  <div class="login-box glass-panel">
    <svg viewBox="0 0 24 24" width="56" height="56" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="3" ry="3"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <h2>Otentikasi Sistem</h2>
    <p>Masukkan kredensial keamanan AQUA TRACK</p>
    
    <input type="password" class="login-input" id="password-input" placeholder="••••••••" onkeypress="handleKeyPress(event)">
    <p id="login-error">Akses Ditolak: Sandi tidak valid!</p>
    
    <button class="global-btn primary" onclick="cekLogin()">Dekripsi & Masuk</button>
  </div>
</div>

<!-- KONTEN DASHBOARD (Sembunyikan Awalnya) -->
<div id="app-content" style="display: none; width: 100%;">
  
  <nav class="navbar">
    <div class="navbar-brand">
      <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12h4l2-9 5 18 3-10h6"></path>
      </svg>
      AQUA TRACK
    </div>
    <div class="nav-right">
      <div style="font-size: 0.9rem; color: var(--text-main); font-weight: 500; letter-spacing: 1px;" id="clock">00:00:00</div>
      <button class="logout-btn" onclick="logout()">Akhiri Sesi</button>
    </div>
  </nav>

  <div class="container">
    <div class="metrics-grid">
      <div class="metric-card glass-panel">
        <div class="metric-info">
          <h3>Koneksi Cloud</h3>
          <p id="db-status" class="c-warning">Menghubungkan...</p>
        </div>
        <div class="metric-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        </div>
      </div>
      
      <div class="metric-card glass-panel">
        <div class="metric-info">
          <h3>Status Hardware (ESP32)</h3>
          <p id="esp-status" class="c-warning">Sinkronisasi...</p>
        </div>
        <div class="metric-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
        </div>
      </div>

      <div class="metric-card glass-panel">
        <div class="metric-info">
          <h3>Sistem Beroperasi</h3>
          <p id="active-count" style="color: var(--primary); text-shadow: 0 0 10px var(--primary-glow);">0 / 4</p>
        </div>
        <div class="metric-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </div>
      </div>
    </div>

    <div class="dashboard-layout">
      <div>
        <div class="section-title">Modul Kendali Saluran</div>
        <div class="controls-grid" id="grid"></div>
      </div>

      <div>
        <div class="panel glass-panel">
          <div class="section-title">Otoritas Master</div>
          <button class="global-btn primary" onclick="setAll(1)">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
            Aktifkan Semua
          </button>
          <button class="global-btn secondary" onclick="setAll(0)">
            Matikan Semua
          </button>
        </div>

        <div class="panel glass-panel">
          <div class="section-title">Log Sistem</div>
          <ul class="log-list" id="log-list">
            <li class="empty-log">Menunggu aktivitas baru...</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// --- LOGIKA LOGIN ---
const PASSWORD_BENAR = "katanyasih";
let intervalSync = null;

function cekLogin() {
  const input = document.getElementById('password-input').value;
  if (input === PASSWORD_BENAR) {
    localStorage.setItem('esp32_logged_in', 'true');
    
    // Animasi transisi yang halus
    document.querySelector('.login-box').style.transform = 'scale(0.9)';
    document.querySelector('.login-box').style.opacity = '0';
    
    setTimeout(() => {
      document.getElementById('login-wrapper').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
      document.getElementById('login-error').style.display = 'none';
      ambilData();
      intervalSync = setInterval(ambilData, 1000);
    }, 300);
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('password-input').value = '';
    const box = document.querySelector('.login-box');
    box.style.transform = 'translateX(10px)';
    setTimeout(() => box.style.transform = 'translateX(-10px)', 100);
    setTimeout(() => box.style.transform = 'translateX(10px)', 200);
    setTimeout(() => box.style.transform = 'translateX(0)', 300);
  }
}

function handleKeyPress(e) {
  if (e.key === 'Enter') cekLogin();
}

function logout() {
  localStorage.removeItem('esp32_logged_in');
  location.reload(); 
}

window.onload = () => {
  if (localStorage.getItem('esp32_logged_in') === 'true') {
    document.getElementById('login-wrapper').style.display = 'none';
    document.getElementById('app-content').style.display = 'block';
    ambilData();
    intervalSync = setInterval(ambilData, 1000);
  }
};


// --- LOGIKA DASHBOARD ---
const FIREBASE_URL = "https://espserver-79064-default-rtdb.firebaseio.com/relay.json";
const pins = [15, 2, 4, 16];
const btnPins = [13, 12, 14, 27];
let data = {relay1:0, relay2:0, relay3:0, relay4:0};

let lastHeartbeatValue = null;
let lastHeartbeatTime = Date.now();
let espIsOnline = false;
let logs = [];

setInterval(() => {
  document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID');
}, 1000);

function addLog(message, isOn) {
  const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  logs.unshift({ time, message, isOn });
  if (logs.length > 5) logs.pop(); 
  renderLogs();
}

function renderLogs() {
  const logList = document.getElementById('log-list');
  if (logs.length === 0) return;
  
  let html = "";
  logs.forEach(log => {
    const textClass = log.isOn ? 'on-text' : 'off-text';
    html += `
      <li class="log-item">
        <span class="log-action ${textClass}">${log.message}</span>
        <span class="log-time">${log.time}</span>
      </li>
    `;
  });
  logList.innerHTML = html;
}

function render(){
  let html = "";
  let activeCount = 0;

  for(let i=1; i<=4; i++){
    let on = data['relay'+i] == 1;
    if (on) activeCount++;
    
    html += `
    <div class="relay-card glass-panel ${on ? 'on' : ''}" onclick="toggle(${i})">
      <div class="relay-header">
        <div class="relay-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
        </div>
        <div class="status-dot"></div>
      </div>
      <div class="relay-info">
        <h4>Saluran ${i}</h4>
        <p>Pin Data ${pins[i-1]} • Saklar ${btnPins[i-1]}</p>
      </div>
      <div class="relay-state">${on ? 'MENGALIR' : 'TERPUTUS'}</div>
    </div>`;
  }
  document.getElementById('grid').innerHTML = html;
  document.getElementById('active-count').innerText = `${activeCount} / 4`;
}

async function ambilData(){
  try{
    let res = await fetch(FIREBASE_URL);
    if(!res.ok) throw new Error("HTTP Error");
    let j = await res.json();
    if(j) { 
      for(let i=1; i<=4; i++) {
        if (data['relay'+i] !== j['relay'+i] && j['relay'+i] !== undefined) {
          data['relay'+i] = j['relay'+i];
          addLog(`Saluran ${i} ${j['relay'+i] === 1 ? 'dinyalakan' : 'dimatikan'} (Perangkat)`, j['relay'+i] === 1);
        }
      }
      if (j.heartbeat !== undefined) {
        if (lastHeartbeatValue === null) {
          lastHeartbeatValue = j.heartbeat;
          lastHeartbeatTime = Date.now();
        } else if (j.heartbeat !== lastHeartbeatValue) {
          lastHeartbeatValue = j.heartbeat;
          lastHeartbeatTime = Date.now();
          espIsOnline = true;
        }
      }
    }
    
    const dbStatus = document.getElementById('db-status');
    dbStatus.innerText = 'Online / Sinkron';
    dbStatus.className = 'c-success';
    
    let timeDiff = Date.now() - lastHeartbeatTime;
    if (timeDiff > 12000) espIsOnline = false;

    const espStatus = document.getElementById('esp-status');
    if (!espIsOnline && timeDiff <= 12000) {
      espStatus.innerText = 'Menganalisis...';
      espStatus.className = 'c-warning';
    } else if (espIsOnline) {
      espStatus.innerText = 'Terhubung Aktif';
      espStatus.className = 'c-success';
    } else {
      espStatus.innerText = 'Koneksi Terputus';
      espStatus.className = 'c-danger';
    }

    render();
  }catch(e){
    document.getElementById('db-status').innerText = 'Server Gangguan';
    document.getElementById('db-status').className = 'c-danger';
    document.getElementById('esp-status').innerText = 'Gagal Sinkronisasi';
    document.getElementById('esp-status').className = 'c-danger';
  }
}

async function kirim(){
  let payload = {
    relay1: data.relay1, relay2: data.relay2, 
    relay3: data.relay3, relay4: data.relay4
  };
  render();
  await fetch(FIREBASE_URL, {method:'PATCH', body: JSON.stringify(payload)});
  ambilData();
}

function toggle(num){
  const newState = data['relay'+num] == 1 ? 0 : 1;
  data['relay'+num] = newState;
  addLog(`Saluran ${num} ${newState ? 'dinyalakan' : 'dimatikan'} (Sistem Web)`, newState === 1);
  kirim();  
}

function setAll(val){
  for(let i=1;i<=4;i++) data['relay'+i] = val;
  addLog(`Semua Saluran ${val ? 'diaktifkan' : 'dimatikan'} (Sistem Web)`, val === 1);
  kirim();
}
</script>
</body>
</html>
