<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Glassmorphism Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-dark: #07090f;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --primary: #38bdf8;
    --glass-bg: rgba(20, 27, 45, 0.4);
    --glass-border: rgba(255, 255, 255, 0.06);
    --glass-border-hover: rgba(255, 255, 255, 0.15);
    --success: #10b981;
    --danger: #f43f5e;
    --warning: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* --- AMBIENT BLUR EFFECTS (Cahaya di Background) --- */
  .blur-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    z-index: -1;
    opacity: 0.6;
    animation: float 10s infinite alternate ease-in-out;
  }
  .orb-1 {
    top: -10%; left: -10%;
    width: 450px; height: 450px;
    background: rgba(56, 189, 248, 0.25);
  }
  .orb-2 {
    bottom: -10%; right: -5%;
    width: 400px; height: 400px;
    background: rgba(16, 185, 129, 0.15);
  }
  
  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 50px) scale(1.1); }
  }

  /* Navbar Kaca */
  .navbar {
    background: rgba(7, 9, 15, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--glass-border);
    padding: 15px 30px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .navbar-brand { font-weight: 700; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
  .navbar-brand svg { color: var(--primary); }

  .container { max-width: 1200px; margin: 0 auto; padding: 30px; }
  .section-title { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1.5px; }

  /* Utilities Kaca */
  .glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
  }

  /* Metrics Grid */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 35px; }
  .metric-card { padding: 20px; display: flex; align-items: center; justify-content: space-between; }
  .metric-info h3 { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
  .metric-info p { font-size: 1.4rem; font-weight: 700; margin-top: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
  
  .metric-icon { 
    width: 50px; height: 50px; border-radius: 14px; 
    background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
  }

  .dashboard-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }

  /* KARTU RELAY (Tombol Utama) */
  .controls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  
  .relay-card {
    padding: 25px 20px; cursor: pointer; position: relative; overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  
  /* Efek Hover Kaca */
  .relay-card:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: var(--glass-border-hover);
    transform: translateY(-4px);
    box-shadow: 0 15px 35px -10px rgba(0,0,0,0.5);
  }
  .relay-card:active { transform: scale(0.96); }

  /* Efek Aktif (Nyala Biru dengan Blur) */
  .relay-card.on {
    background: rgba(56, 189, 248, 0.08);
    border-color: rgba(56, 189, 248, 0.4);
    box-shadow: 0 15px 40px -10px rgba(56, 189, 248, 0.2), inset 0 0 25px rgba(56, 189, 248, 0.05);
  }
  
  .relay-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; }
  .relay-icon { color: #475569; transition: 0.4s; }
  .relay-card.on .relay-icon { color: var(--primary); filter: drop-shadow(0 0 12px rgba(56,189,248,0.8)); }
  
  .status-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.1); transition: 0.4s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
  .relay-card.on .status-dot { background: var(--primary); box-shadow: 0 0 15px var(--primary), inset 0 0 5px #fff; }

  .relay-info h4 { font-size: 1.15rem; font-weight: 600; margin-bottom: 4px; }
  .relay-info p { font-size: 0.75rem; color: var(--text-muted); opacity: 0.7; }
  .relay-state { font-size: 1.4rem; font-weight: 700; color: #475569; margin-top: 10px; transition: 0.4s; }
  .relay-card.on .relay-state { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

  /* Sidebar */
  .panel { padding: 25px; margin-bottom: 20px; }
  
  /* Tombol Global Kaca */
  .global-btn {
    width: 100%; padding: 16px; border-radius: 14px; font-size: 0.9rem; font-weight: 600; font-family: 'Inter', sans-serif;
    cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px;
    backdrop-filter: blur(10px);
  }
  .global-btn.primary { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: var(--primary); }
  .global-btn.primary:hover { background: rgba(56, 189, 248, 0.25); box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); transform: translateY(-2px); }
  .global-btn.secondary { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border); color: var(--text-muted); }
  .global-btn.secondary:hover { background: rgba(255, 255, 255, 0.08); color: #fff; transform: translateY(-2px); }

  /* Logs */
  .log-list { list-style: none; margin-top: 15px; }
  .log-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--glass-border); font-size: 0.85rem; }
  .log-item:last-child { border-bottom: none; }
  .log-time { color: var(--text-muted); font-size: 0.75rem; background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 8px; }
  .log-action { font-weight: 500; }
  .log-action.on-text { color: var(--primary); }
  .log-action.off-text { color: var(--text-muted); }
  .empty-log { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px 0; font-style: italic; }

  .c-success { color: var(--success); }
  .c-danger { color: var(--danger); }
  .c-warning { color: var(--warning); }

  @media (max-width: 900px) { .dashboard-layout { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { .controls-grid { grid-template-columns: 1fr; } .container { padding: 20px 15px; } }
</style>
</head>
<body>

<!-- Ambient Light Orbs -->
<div class="blur-orb orb-1"></div>
<div class="blur-orb orb-2"></div>

<nav class="navbar">
  <div class="navbar-brand">
    <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
    </svg>
    AQUA TRACK
  </div>
  <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;" id="clock">00:00:00</div>
</nav>

<div class="container">
  <!-- Metrics Section -->
  <div class="metrics-grid">
    <div class="metric-card glass-panel">
      <div class="metric-info">
        <h3>Server Sync</h3>
        <p id="db-status" class="c-warning">Menghubungkan</p>
      </div>
      <div class="metric-icon" style="color: var(--primary);">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
      </div>
    </div>
    
    <div class="metric-card glass-panel">
      <div class="metric-info">
        <h3>Hardware Status</h3>
        <p id="esp-status" class="c-warning">Mengecek...</p>
      </div>
      <div class="metric-icon" style="color: var(--success);">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
      </div>
    </div>

    <div class="metric-card glass-panel">
      <div class="metric-info">
        <h3>Active Relays</h3>
        <p id="active-count" style="color: #fff;">0 / 4</p>
      </div>
      <div class="metric-icon" style="color: #fff;">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
      </div>
    </div>
  </div>

  <!-- Main Dashboard Layout -->
  <div class="dashboard-layout">
    
    <div>
      <div class="section-title">Control Hub</div>
      <div class="controls-grid" id="grid">
        <!-- Rendered by JS -->
      </div>
    </div>

    <div>
      <div class="panel glass-panel">
        <div class="section-title">Master Override</div>
        <button class="global-btn primary" onclick="setAll(1)">
          Power ON All Units
        </button>
        <button class="global-btn secondary" onclick="setAll(0)">
          Power OFF All
        </button>
      </div>

      <div class="panel glass-panel">
        <div class="section-title">Activity Stream</div>
        <ul class="log-list" id="log-list">
          <li class="empty-log">Listening to events...</li>
        </ul>
      </div>
    </div>

  </div>
</div>

<script>
// --- LOGIKA JS TETAP SAMA DAN STABIL ---
const FIREBASE_URL = "https://espserver-79064-default-rtdb.firebaseio.com/relay.json";
const pins = [15, 2, 4, 16];
const btnPins = [13, 12, 14, 27];
let data = {relay1:0, relay2:0, relay3:0, relay4:0};

let lastHeartbeatValue = null;
let lastHeartbeatTime = Date.now();
let espIsOnline = false;
let logs = [];

setInterval(() => {
  document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID');
}, 1000);

function addLog(message, isOn) {
  const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  logs.unshift({ time, message, isOn });
  if (logs.length > 5) logs.pop(); 
  renderLogs();
}

function renderLogs() {
  const logList = document.getElementById('log-list');
  if (logs.length === 0) return;
  
  let html = "";
  logs.forEach(log => {
    const textClass = log.isOn ? 'on-text' : 'off-text';
    html += `
      <li class="log-item">
        <span class="log-action ${textClass}">${log.message}</span>
        <span class="log-time">${log.time}</span>
      </li>
    `;
  });
  logList.innerHTML = html;
}

function render(){
  let html = "";
  let activeCount = 0;

  for(let i=1; i<=4; i++){
    let on = data['relay'+i] == 1;
    if (on) activeCount++;
    
    html += `
    <div class="relay-card glass-panel ${on ? 'on' : ''}" onclick="toggle(${i})">
      <div class="relay-header">
        <div class="relay-icon">
          <svg viewBox="0 0 24 24" width="30" height="30" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        </div>
        <div class="status-dot"></div>
      </div>
      <div>
        <div class="relay-info">
          <h4>Unit ${i}</h4>
          <p>PIN ${pins[i-1]} • SW ${btnPins[i-1]}</p>
        </div>
        <div class="relay-state">${on ? 'ONLINE' : 'OFFLINE'}</div>
      </div>
    </div>`;
  }
  document.getElementById('grid').innerHTML = html;
  document.getElementById('active-count').innerText = `${activeCount} / 4`;
}

async function ambilData(){
  try{
    let res = await fetch(FIREBASE_URL);
    if(!res.ok) throw new Error("HTTP Error");
    let j = await res.json();
    if(j) { 
      for(let i=1; i<=4; i++) {
        if (data['relay'+i] !== j['relay'+i] && j['relay'+i] !== undefined) {
          data['relay'+i] = j['relay'+i];
          addLog(`Unit ${i} ${j['relay'+i] === 1 ? 'dinyalakan' : 'dimatikan'} (Hardware)`, j['relay'+i] === 1);
        }
      }
      
      if (j.heartbeat !== undefined) {
        if (lastHeartbeatValue === null) {
          lastHeartbeatValue = j.heartbeat;
          lastHeartbeatTime = Date.now();
        } else if (j.heartbeat !== lastHeartbeatValue) {
          lastHeartbeatValue = j.heartbeat;
          lastHeartbeatTime = Date.now();
          espIsOnline = true;
        }
      }
    }
    
    const dbStatus = document.getElementById('db-status');
    dbStatus.innerText = 'Connected';
    dbStatus.className = 'c-success';
    
    let timeDiff = Date.now() - lastHeartbeatTime;
    if (timeDiff > 12000) espIsOnline = false;

    const espStatus = document.getElementById('esp-status');
    if (!espIsOnline && timeDiff <= 12000) {
      espStatus.innerText = 'Syncing...';
      espStatus.className = 'c-warning';
    } else if (espIsOnline) {
      espStatus.innerText = 'Active';
      espStatus.className = 'c-success';
    } else {
      espStatus.innerText = 'Disconnected';
      espStatus.className = 'c-danger';
    }

    render();
  }catch(e){
    document.getElementById('db-status').innerText = 'Offline';
    document.getElementById('db-status').className = 'c-danger';
    document.getElementById('esp-status').innerText = 'Fail';
    document.getElementById('esp-status').className = 'c-danger';
  }
}

async function kirim(){
  let payload = {
    relay1: data.relay1, relay2: data.relay2, 
    relay3: data.relay3, relay4: data.relay4
  };
  render();
  await fetch(FIREBASE_URL, {method:'PATCH', body: JSON.stringify(payload)});
  ambilData();
}

function toggle(num){
  const newState = data['relay'+num] == 1 ? 0 : 1;
  data['relay'+num] = newState;
  addLog(`Unit ${num} ${newState ? 'dinyalakan' : 'dimatikan'} (Web)`, newState === 1);
  kirim();  
}

function setAll(val){
  for(let i=1;i<=4;i++) data['relay'+i] = val;
  addLog(`Master Switch: All ${val ? 'ON' : 'OFF'}`, val === 1);
  kirim();
}

ambilData();
setInterval(ambilData, 1000);
</script>
</body>
</html>
