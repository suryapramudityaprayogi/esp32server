<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Relay Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --card-hover: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --sky-blue: #38bdf8;
    --sky-glow: rgba(56, 189, 248, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 40px 20px;
  }

  .container { width: 100%; max-width: 500px; }

  /* Header Minimalis */
  .header { text-align: center; margin-bottom: 30px; }
  h2 { font-weight: 700; font-size: 1.5rem; letter-spacing: 0.5px; }
  .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

  /* Indikator Status Elegan */
  #koneksi-wrapper {
    display: flex; justify-content: center; gap: 12px; margin-bottom: 35px;
  }
  .status-badge {
    font-size: 0.75rem; font-weight: 600; padding: 6px 12px; border-radius: 30px;
    background: var(--card-bg); color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
    transition: 0.3s;
  }
  .indicator { width: 8px; height: 8px; border-radius: 50%; background: #475569; }
  .indicator.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
  .indicator.offline { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  .indicator.checking { background: #f59e0b; }

  /* Grid Relay */
  .grid { 
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
    gap: 16px; margin-bottom: 30px; 
  }

  /* KARTU SEBAGAI TOMBOL UTAMA */
  .card {
    position: relative;
    background: var(--card-bg);
    padding: 25px 20px;
    border-radius: 20px;
    border: 2px solid transparent;
    cursor: pointer;
    text-align: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  
  /* Efek Hover & Klik */
  .card:hover { background: var(--card-hover); transform: translateY(-3px); }
  .card:active { transform: scale(0.96); }

  /* Status Aktif (Menyala Sky Blue) */
  .card.on {
    background: linear-gradient(145deg, #1e293b, #0f172a);
    border-color: var(--sky-blue);
    box-shadow: 0 10px 25px var(--sky-glow), inset 0 0 15px var(--sky-glow);
  }

  /* Lingkaran Indikator di Pojok Kartu */
  .state-dot {
    position: absolute; top: 15px; right: 15px;
    width: 8px; height: 8px; border-radius: 50%; background: #475569;
    transition: 0.3s;
  }
  .card.on .state-dot { background: var(--sky-blue); box-shadow: 0 0 10px var(--sky-blue); }

  /* Ikon & Teks */
  .icon { color: #64748b; margin-bottom: 12px; transition: 0.3s; }
  .card.on .icon { color: var(--sky-blue); filter: drop-shadow(0 0 5px var(--sky-blue)); }
  
  .card-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 2px; }
  .pin-info { font-size: 0.7rem; color: var(--text-muted); font-weight: 300; margin-bottom: 15px; }
  
  .state-text { 
    font-size: 1.2rem; font-weight: 700; color: #64748b; 
    letter-spacing: 1px; transition: 0.3s;
  }
  .card.on .state-text { color: var(--text-main); }

  /* Tombol Global Minimalis */
  .global-controls { display: flex; gap: 12px; margin-bottom: 20px; }
  .btn-global {
    flex: 1; padding: 14px; border-radius: 14px; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; transition: 0.3s; border: none; font-family: 'Inter', sans-serif;
  }
  .btn-global.on { background: var(--sky-blue); color: var(--bg-dark); }
  .btn-global.on:hover { background: #0ea5e9; transform: translateY(-2px); }
  .btn-global.off { background: transparent; border: 1px solid #334155; color: var(--text-muted); }
  .btn-global.off:hover { background: #334155; color: var(--text-main); transform: translateY(-2px); }

  #last { text-align: center; font-size: 0.7rem; color: #475569; margin-top: 10px; }

  @media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Smart Relay</h2>
    <div class="subtitle">IoT Management System</div>
  </div>

  <div id="koneksi-wrapper">
    <div id="koneksi-web" class="status-badge"><span class="indicator"></span> DB Sync</div>
    <div id="koneksi-esp" class="status-badge"><span class="indicator"></span> Device</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="global-controls">
    <button class="btn-global on" onclick="setAll(1)">ALL ON</button>
    <button class="btn-global off" onclick="setAll(0)">ALL OFF</button>
  </div>

  <p id="last">Sync: -</p>
</div>

<script>
const FIREBASE_URL = "https://espserver-79064-default-rtdb.firebaseio.com/relay.json";
const pins = [15, 2, 4, 16];
const btnPins = [13, 12, 14, 27];
let data = {relay1:0, relay2:0, relay3:0, relay4:0};

let lastHeartbeatValue = null;
let lastHeartbeatTime = Date.now();
let espIsOnline = false;

function render(){
  let html = "";
  for(let i=1; i<=4; i++){
    let on = data['relay'+i] == 1;
    // KARTU DIJADIKAN SATU TOMBOL PENUH (onclick di div)
    html += `
    <div class="card ${on ? 'on' : ''}" onclick="toggle(${i})">
      <div class="state-dot"></div>
      <div class="icon">
        <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
      </div>
      <div class="card-title">Relay ${i}</div>
      <div class="pin-info">P${pins[i-1]} • B${btnPins[i-1]}</div>
      <div class="state-text">${on ? 'ON' : 'OFF'}</div>
    </div>`;
  }
  document.getElementById('grid').innerHTML = html;
}

async function ambilData(){
  try{
    let res = await fetch(FIREBASE_URL);
    if(!res.ok) throw new Error("HTTP Error");
    let j = await res.json();
    if(j) { 
      data = Object.assign(data, j);
      if (j.heartbeat !== undefined) {
        if (lastHeartbeatValue === null) {
          lastHeartbeatValue = j.heartbeat;
          lastHeartbeatTime = Date.now();
        } else if (j.heartbeat !== lastHeartbeatValue) {
          lastHeartbeatValue = j.heartbeat;
          lastHeartbeatTime = Date.now();
          espIsOnline = true;
        }
      }
    }
    
    document.getElementById('koneksi-web').innerHTML = '<span class="indicator online"></span> DB Sync';
    
    let timeDiff = Date.now() - lastHeartbeatTime;
    if (timeDiff > 12000) espIsOnline = false;

    if (!espIsOnline && timeDiff <= 12000) {
      document.getElementById('koneksi-esp').innerHTML = '<span class="indicator checking"></span> Checking';
    } else if (espIsOnline) {
      document.getElementById('koneksi-esp').innerHTML = '<span class="indicator online"></span> Device Online';
    } else {
      document.getElementById('koneksi-esp').innerHTML = '<span class="indicator offline"></span> Device Offline';
    }

    let d = new Date();
    document.getElementById('last').innerHTML = "Last sync: " + d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0') + ":" + d.getSeconds().toString().padStart(2,'0');
    render();
  }catch(e){
    document.getElementById('koneksi-web').innerHTML = `<span class="indicator offline"></span> DB Error`;
    document.getElementById('koneksi-esp').innerHTML = `<span class="indicator offline"></span> No Device`;
  }
}

async function kirim(){
  let payload = {
    relay1: data.relay1, relay2: data.relay2, 
    relay3: data.relay3, relay4: data.relay4
  };
  // Optimistic UI: render dulu biar terasa cepat tanpa nunggu server
  render();
  await fetch(FIREBASE_URL, {method:'PATCH', body: JSON.stringify(payload)});
  ambilData();
}

function toggle(num){
  data['relay'+num] = data['relay'+num] == 1 ? 0 : 1;
  kirim();  
}

function setAll(val){
  for(let i=1;i<=4;i++) data['relay'+i] = val;
  kirim();
}

ambilData();
setInterval(ambilData, 1000);
</script>
</body>
</html>
